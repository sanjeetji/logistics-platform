name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/logistics

jobs:
  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - gateway-service
          - auth-service
          - user-service
          - order-service
          - dispatch-service
          - fleet-service
          - parcel-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build JAR for ${{ matrix.service }}
        run: |
          if [[ "${{ matrix.service }}" == "gateway-service" ]]; then
            mvn clean package -DskipTests -pl infrastructure/${{ matrix.service }} -am
          elif [[ "${{ matrix.service }}" == "parcel-service" ]]; then
            mvn clean package -DskipTests -pl b2c-engine/${{ matrix.service }} -am
          else
            mvn clean package -DskipTests -pl platform-core/${{ matrix.service }} -am
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: |
            ${{ matrix.service == 'gateway-service' && 'infrastructure/gateway-service' || 
                matrix.service == 'parcel-service' && 'b2c-engine/parcel-service' || 
                format('platform-core/{0}', matrix.service) }}
          dockerfile: |
            ${{ matrix.service == 'gateway-service' && 'infrastructure/gateway-service/Dockerfile' || 
                matrix.service == 'parcel-service' && 'b2c-engine/Dockerfile' || 
                'platform-core/Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
