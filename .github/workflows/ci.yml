name: CI — Build & Test

on:
  push:
    branches: [ main, develop, feature/**, fix/**, hotfix/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Compile the entire multi-module project
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all modules (skip tests)
        run: mvn clean package -DskipTests -B
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # Cache the built JAR so the test job can reuse it without rebuilding
      - name: Cache built artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/*.jar
            ~/.m2/repository
          key: build-${{ github.run_id }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: logistic-app-jar
          path: logistic-app/target/*.jar
          retention-days: 3

  # ─────────────────────────────────────────────
  # JOB 2: Run unit tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/*.jar
            ~/.m2/repository
          key: build-${{ github.run_id }}

      - name: Run unit tests
        run: mvn test -B -Dnet.bytebuddy.experimental=true
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report -B || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Trigger Docker build on main branch
  # ─────────────────────────────────────────────
  trigger-docker-build:
    name: 🐳 Trigger Docker Build
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger docker-build workflow
        run: |
          echo "✅ CI passed on main — Docker Build workflow will run automatically."
          echo "   Image will be pushed to: ghcr.io/${{ github.repository_owner }}/logistics-platform/logistic-app"
