spring.application.name=warehouse-service
server.port=8089

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_warehouse
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.logistics.warehouse=DEBUG

# Inventory Settings
inventory.low-stock-threshold=10
inventory.reorder-quantity=100
