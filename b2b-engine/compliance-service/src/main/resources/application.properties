spring.application.name=compliance-service
server.port=8090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_compliance
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document Storage
document.storage.path=/var/logistics/documents
document.storage.url=http://localhost:8090/api/v1/documents/files

# Logging
logging.level.com.logistics.compliance=DEBUG
