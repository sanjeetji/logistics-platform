spring.application.name=route-service
server.port=8088

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_route
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ML Service Integration
ml.service.url=http://localhost:8092

# Logging
logging.level.com.logistics.route=DEBUG

# Route Optimization Settings
route.optimization.max-iterations=100
route.optimization.improvement-threshold=0.01
