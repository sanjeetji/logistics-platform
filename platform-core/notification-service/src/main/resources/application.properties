spring.application.name=notification-service
server.port=8093

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_notifications
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS Configuration (Mock - replace with actual Twilio credentials)
notification.sms.provider=twilio
notification.sms.account-sid=${TWILIO_ACCOUNT_SID:mock-account-sid}
notification.sms.auth-token=${TWILIO_AUTH_TOKEN:mock-auth-token}
notification.sms.from-number=${TWILIO_FROM_NUMBER:+1234567890}

# Push Notification Configuration (FCM)
notification.fcm.server-key=${FCM_SERVER_KEY:mock-fcm-key}

# Logging
logging.level.com.logistics.notification=DEBUG

# Notification Settings
notification.retry.max-attempts=3
notification.retry.delay=5000
