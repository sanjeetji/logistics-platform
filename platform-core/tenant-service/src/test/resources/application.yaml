spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/}tenant_service_test
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:password} # Replace with your local DB password if different
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop # Re-creates schema for every test run to ensure clean state
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Disable unnecessary services for testing
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
