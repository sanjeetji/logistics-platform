spring.application.name=driver-app-service
server.port=8086

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.logistics.driver=DEBUG

# External Service URLs
fleet.service.url=http://localhost:8083
order.service.url=http://localhost:8081
