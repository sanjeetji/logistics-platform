server:
  port: 8100

spring:
  application:
    name: erp-integration-service
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_db
    username: logistics_user
    password: logistics_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: erp-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

sap:
  baseUrl: ${SAP_BASE_URL:https://mock-sap-instance.com/odata/v2}
  username: ${SAP_USERNAME:sap_user}
  password: ${SAP_PASSWORD:sap_pass}
  sync:
    order-cron: "0 0/15 * * * ?"
    inventory-cron: "0 0/30 * * * ?"

oracle:
  baseUrl: ${ORACLE_BASE_URL:https://mock-oracle-ebs.com/rest}
  username: ${ORACLE_USERNAME:oracle_user}
  password: ${ORACLE_PASSWORD:oracle_pass}
  sync:
    order-cron: "0 0/15 * * * ?"
    inventory-cron: "0 0/30 * * * ?"
