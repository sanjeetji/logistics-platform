spring:
  application:
    name: tenant-onboarding-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/logistics_onboarding}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8097

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_secret_here}
  
# Trial Configuration
trial:
  duration-days: 14
  auto-convert-to-paid: false
  
# Onboarding Configuration
onboarding:
  email:
    welcome-enabled: true
    setup-guide-enabled: true
    check-in-days: 3,7,14
  webhook:
    callback-url: ${WEBHOOK_CALLBACK_URL:http://localhost:8097/api/onboarding/stripe/webhook}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.logistics: DEBUG
    com.stripe: INFO
