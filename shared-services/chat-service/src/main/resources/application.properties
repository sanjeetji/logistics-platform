spring.application.name=chat-service
server.port=8108

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres-db:5432/chat_db
spring.datasource.username=logistics_user
spring.datasource.password=logistics_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logging
logging.level.org.springframework.web.socket=DEBUG
