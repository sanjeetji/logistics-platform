spring.application.name=master-data-service
server.port=8110

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres-db:5432/master_data_db
spring.datasource.username=logistics_user
spring.datasource.password=logistics_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true
