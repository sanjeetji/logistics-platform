spring:
  application:
    name: Notification Service
  
  # Email Configuration
  mail:
    # SMTP Host - Update based on your email provider
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        
        # For debugging (disable in production)
        debug: ${MAIL_DEBUG:false}
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Database Configuration (for trial reminder scheduler)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/logistics_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Server Configuration
server:
  port: ${SERVER_PORT:8095}

# Logging
logging:
  level:
    root: INFO
    com.logistics.notification: ${LOG_LEVEL:DEBUG}
    org.springframework.mail: ${MAIL_LOG_LEVEL:DEBUG}
    org.springframework.kafka: INFO

# Application-specific properties
notification:
  email:
    from-address: ${EMAIL_FROM_ADDRESS:noreply@logistics-platform.com}
    from-name: ${EMAIL_FROM_NAME:Logistics Platform}
  
  scheduler:
    trial-reminder:
      enabled: ${TRIAL_REMINDER_ENABLED:true}
      cron: ${TRIAL_REMINDER_CRON:0 0 9 * * *}  # Daily at 9 AM
