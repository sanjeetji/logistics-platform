server:
  port: 8094

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: logistics_user
    password: logistics_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

payment:
  gateways:
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_mock}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_mock}
      key-secret: ${RAZORPAY_KEY_SECRET:mock_secret}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:mock_client_id}
      client-secret: ${PAYPAL_CLIENT_SECRET:mock_secret}
      mode: sandbox
