server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native, dev
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

# Security Configuration for Config Server itself (Basic Auth)
# Allow access to actuators/config without auth for dev simplicity, or set specific user
spring.security.user:
  name: admin
  password: admin_password

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
