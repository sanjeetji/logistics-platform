version: '3.8'

services:

  logistic-app:
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      JAVA_TOOL_OPTIONS: "-Xmx1g -Xms512m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
      replicas: 2
    networks:
      - logistics-network

  # Load balancer
  nginx:
    image: nginx:alpine
    container_name: logistics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - logistics-network
    depends_on:
      - logistic-app
