version: '3.8'

services:
  mysql-db:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-StrongP@ssw0rd!}
      MYSQL_DATABASE: ${DB_NAME:-logistics_prod}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  platform-core:
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      JAVA_TOOL_OPTIONS: "-Xmx1g -Xms512m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
      replicas: 2

  b2b-engine:
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
      replicas: 2

  b2c-engine:
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
      replicas: 2

  # Add load balancer
  nginx:
    image: nginx:alpine
    container_name: logistics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - logistics-network
    depends_on:
      - platform-core
      - b2b-engine
      - b2c-engine