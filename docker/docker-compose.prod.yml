# docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Production overrides — layered on top of docker-compose.yml.
#
# Usage (on your production server):
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.prod.yml \
#     up -d
#
# The CI/CD workflow (deploy-prod.yml) manages this automatically.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ──────────────────────────────────────────────────────────────
  logistic-app:
    # Image is set by the deploy workflow via LOGISTIC_APP_IMAGE env var.
    # Example: ghcr.io/sanjeetji/logistics-platform/logistic-app:v1.2.0
    image: ${LOGISTIC_APP_IMAGE:-ghcr.io/sanjeetji/logistics-platform/logistic-app:latest}
    container_name: logistics-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      # JVM tuning for production
      JAVA_TOOL_OPTIONS: >-
        -Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof
      # All sensitive values must be provided as environment variables
      # or via Docker secrets — never hardcoded below.
      SPRING_DATASOURCE_URL: ${PROD_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${PROD_REDIS_HOST:-redis}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${PROD_KAFKA_BROKERS:-kafka:29092}
      SPRING_MAIL_HOST: ${PROD_MAIL_HOST}
      SPRING_MAIL_PORT: ${PROD_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${PROD_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${PROD_MAIL_PASSWORD}
      AWS_REGION: ${PROD_AWS_REGION}
      AWS_ACCESS_KEY_ID: ${PROD_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${PROD_AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${PROD_JWT_SECRET}
      SERVER_PORT: "8080"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q 'UP'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - logistics-network

  # ── Nginx — SSL termination + reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: logistics-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro # Mount your SSL certs here
      - nginx-logs:/var/log/nginx
    depends_on:
      logistic-app:
        condition: service_healthy
    networks:
      - logistics-network

  # ── PostgreSQL — production tuning ──────────────────────────────────────────
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: logistics_postgres
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis — production mode (persistence on) ─────────────────────────────────
  redis:
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec --requirepass ${PROD_REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ── Kafka — production tuning ────────────────────────────────────────────────
  kafka:
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"

volumes:
  nginx-logs:
    driver: local

networks:
  logistics-network:
    driver: bridge
