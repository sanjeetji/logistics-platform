# PostgreSQL Configuration for Spring Boot

spring:
  datasource:
    # Primary PostgreSQL datasource
    postgres:
      url: jdbc:postgresql://postgres-db:5432/logistics_core_pg
      username: logistics_user
      password: logistics_pass
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
        max-lifetime: 1800000

    # B2B PostgreSQL datasource
    b2b-postgres:
      url: jdbc:postgresql://postgres-db:5432/logistics_b2b_pg
      username: logistics_user
      password: logistics_pass
      driver-class-name: org.postgresql.Driver

    # B2C PostgreSQL datasource
    b2c-postgres:
      url: jdbc:postgresql://postgres-db:5432/logistics_b2c_pg
      username: logistics_user
      password: logistics_pass
      driver-class-name: org.postgresql.Driver

  jpa:
    # PostgreSQL specific JPA properties
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: public
      javax:
        persistence:
          schema-generation:
            database:
              action: update

  # Flyway configuration for PostgreSQL (optional)
  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
    baseline-on-migrate: true
    validate-on-migrate: true