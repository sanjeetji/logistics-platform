spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/dispatch_db
    username: logistics_user
    password: logistics_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: BASIC
fleet-service:
  url: http://fleet-service:8080
order-service:
  url: http://order-service:8080
