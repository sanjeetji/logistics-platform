services:
  # Database Services
  mysql-db:
    image: mysql:8.0
    container_name: logistics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logistics-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - logistics-network
    command: redis-server --requirepass redispass

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: logistics-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - logistics-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  # Service Discovery
  service-discovery:
    build:
      context: ../infrastructure/service-discovery
      dockerfile: Dockerfile
    container_name: logistics-service-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
    networks:
      - logistics-network
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server
  config-server:
    build:
      context: ../infrastructure/config-server
      dockerfile: Dockerfile
    container_name: logistics-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native,docker
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:///configs
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: file:///configs
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
    volumes:
      - ./configs:/configs
    networks:
      - logistics-network
    depends_on:
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # CENTRALIZED LOGGING STACK
  loki:
    image: grafana/loki:latest
    container_name: logistics-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - logistics-network

  promtail:
    image: grafana/promtail:latest
    container_name: logistics-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logistics-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: logistics-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - logistics-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: logistics-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml
      - /tmp/tempo:/tmp/tempo
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200" # tempo
      - "9411:9411" # zipkin
    networks:
      - logistics-network

  # Centralized Logging Stack (Loki + Promtail + Grafana)...
  # (Already added in previous step)

  # Infrastructure: Gateway Service
  gateway-service:
    build:
      context: ../infrastructure/gateway-service
      dockerfile: Dockerfile
    container_name: logistics-gateway
    restart: unless-stopped
    ports:
      - "80:8080" # Gateway usually exposes 80 or 8080
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      LOGGING_PATTERN_LEVEL: "%5p [$${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - ../infrastructure/gateway-service/target/gateway-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    networks:
      - logistics-network
    depends_on:
      - service-discovery
      - config-server
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Platform Core Services
  auth-service:
    build:
      context: ../platform-core/auth-service
      dockerfile: ../Dockerfile
    container_name: logistics-auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/auth_db
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      LOGGING_PATTERN_LEVEL: "%5p [$${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_APPLICATION_JSON: '{"spring": {"jpa": {"hibernate": {"ddl-auto": "update"}}}, "eureka": {"client": {"serviceUrl": {"defaultZone": "http://service-discovery:8761/eureka/"}}}}'
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      config-server:
        condition: service_healthy

  user-service:
    build:
      context: ../platform-core/user-service
      dockerfile: ../Dockerfile
    container_name: logistics-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/user_db
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_APPLICATION_JSON: '{"spring": {"jpa": {"hibernate": {"ddl-auto": "update"}}}, "eureka": {"client": {"serviceUrl": {"defaultZone": "http://service-discovery:8761/eureka/"}}}}'
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      config-server:
        condition: service_healthy

  fleet-service:
    build:
      context: ../platform-core/fleet-service
      dockerfile: ../Dockerfile
    container_name: logistics-fleet-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/fleet_db
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_APPLICATION_JSON: '{"spring": {"jpa": {"hibernate": {"ddl-auto": "update"}}}, "eureka": {"client": {"serviceUrl": {"defaultZone": "http://service-discovery:8761/eureka/"}}}}'
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      config-server:
        condition: service_healthy

  order-service:
    build:
      context: ../platform-core/order-service
      dockerfile: ../Dockerfile
    container_name: logistics-order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/order_db
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_APPLICATION_JSON: '{"spring": {"jpa": {"hibernate": {"ddl-auto": "update"}}}, "eureka": {"client": {"serviceUrl": {"defaultZone": "http://service-discovery:8761/eureka/"}}}}'
    command: [ "java", "-jar", "/app/app.jar", "--debug" ]
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      config-server:
        condition: service_healthy

  dispatch-service:
    build:
      context: ../platform-core/dispatch-service
      dockerfile: ../Dockerfile
    container_name: logistics-dispatch-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/dispatch_db
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_APPLICATION_JSON: '{"spring": {"jpa": {"hibernate": {"ddl-auto": "update"}}}, "eureka": {"client": {"serviceUrl": {"defaultZone": "http://service-discovery:8761/eureka/"}}}}'
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started
      config-server:
        condition: service_healthy

  # B2B Engine Services
  # B2B Engine Services
  # (Moved to Platform Core)

  # B2C Engine Services
  parcel-service:
    build:
      context: ../b2c-engine/parcel-service
      dockerfile: ../Dockerfile
    container_name: logistics-parcel-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/logistics_b2c_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
    entrypoint: [ "java", "-jar", "/app/app.jar" ]
    networks:
      - logistics-network
    depends_on:
      - mysql-db
      - service-discovery
      - config-server

  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics_user
      POSTGRES_PASSWORD: logistics_pass
      POSTGRES_DB: logistics_postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logistics-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logistics_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin4 - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logistics-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@logistics.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_LOGIN_BANNER: "'Logistics Platform PostgreSQL'"
      PGADMIN_CONFIG_LOG_FILE: "'/var/lib/pgadmin/pgadmin.log'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./docker/pgadmin/pgpass:/pgpass
      - ./docker/pgadmin/pgadmin.config.py:/pgadmin4/config_local.py
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------------------------
  # Phase 5: Advanced & Shared Services
  # --------------------------------------------------------------------------

  analytics-service:
    build:
      context: ../shared-services/analytics-service
      dockerfile: ../Dockerfile
    container_name: logistics-analytics-service
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  notification-service:
    build:
      context: ../shared-services/notification-service
      dockerfile: ../Dockerfile
    container_name: logistics-notification-service
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/notifications_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-placeholder}
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: logistics-ml-service
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      DATABASE_URL: postgresql://logistics_user:logistics_pass@postgres-db:5432/ml_db
      SERVICE_PORT: 8092
      LOG_LEVEL: INFO
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy

  geo-service:
    build:
      context: ../shared-services/geo-service
      dockerfile: ../Dockerfile
    container_name: logistics-geo-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/geo_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-placeholder}
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  pricing-service:
    build:
      context: ../shared-services/pricing-service
      dockerfile: ../Dockerfile
    container_name: logistics-pricing-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/pricing_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  payment-service:
    build:
      context: ../shared-services/payment-service
      dockerfile: ../Dockerfile
    container_name: logistics-payment-service
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  team-service:
    build:
      context: ../b2b-engine/team-service
      dockerfile: ../Dockerfile
    container_name: logistics-team-service
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/team_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  billing-service:
    build:
      context: ../shared-services/billing-service
      dockerfile: ../Dockerfile
    container_name: logistics-billing-service
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/billing_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  tracking-service:
    build:
      context: ../shared-services/tracking-service
      dockerfile: ../Dockerfile
    container_name: logistics-tracking-service
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - logistics-network
    depends_on:
      redis:
        condition: service_started
      service-discovery:
        condition: service_started

  returns-service:
    build:
      context: ../shared-services/returns-service
      dockerfile: ../Dockerfile
    container_name: logistics-returns-service
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/returns_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  payout-service:
    build:
      context: ../shared-services/payout-service
      dockerfile: ../Dockerfile
    container_name: logistics-payout-service
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/payouts_db
      SPRING_DATASOURCE_USERNAME: logistics_user
      SPRING_DATASOURCE_PASSWORD: logistics_pass
    networks:
      - logistics-network
    depends_on:
      postgres-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

networks:
  logistics-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  postgres-data:
  pgadmin-data:
