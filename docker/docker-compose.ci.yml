# docker-compose.ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Lightweight compose override used ONLY in GitHub Actions CI.
# Starts ONLY the infrastructure services needed for integration tests.
# The logistic-app itself is built and tested directly by Maven — not via Docker.
#
# Usage:
#   docker compose -f docker/docker-compose.ci.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: ci-postgres
    environment:
      POSTGRES_USER: logistics_user
      POSTGRES_PASSWORD: logistics_pass
      POSTGRES_DB: logistics_postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logistics_user -d logistics_postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data    # Use RAM disk in CI — faster, no persistence needed

  redis:
    image: redis:7-alpine
    container_name: ci-redis
    ports:
      - "6379:6379"
    command: redis-server --save ""   # Disable persistence in CI
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ci-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ci-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"    # Lower memory for CI runner
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

# No named volumes — everything is ephemeral in CI
