apm-server:
  host: "0.0.0.0:8200"
  rum:
    enabled: true
    allow_origins: ['*']
    allow_headers: ["*"]
  
  # Capture body for errors
  capture_body: errors
  
  # API key auth (disabled for development)
  api_key:
    enabled: false
  
  # Secret token auth (disabled for development)
  secret_token: ""

# Output to Elasticsearch
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  indices:
    - index: "apm-%{[processor.event]}-%{+yyyy.MM.dd}"

# Kibana endpoint
setup.kibana:
  host: "kibana:5601"

# Logging
logging.level: info
logging.to_files: true

# Monitoring
monitoring.enabled: true
monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
