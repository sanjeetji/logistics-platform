input {
  beats {
    port => 5044
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Add timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Extract service name from container or log source
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Parse log level
  if [level] {
    mutate {
      add_field => { "log_level" => "%{[level]}" }
    }
  }

  # Add trace ID for correlation
  if [traceId] {
    mutate {
      add_field => { "trace_id" => "%{[traceId]}" }
    }
  }

  # Clean up
  mutate {
    remove_field => ["host", "agent", "ecs", "input"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logistics-logs-%{+YYYY.MM.dd}"
    
    # Template for index mapping
    template_name => "logistics-logs"
    template_overwrite => true
  }

  # Debug output (optional for development)
  stdout {
    codec => rubydebug
  }
}
