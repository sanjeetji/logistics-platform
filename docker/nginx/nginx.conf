worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream platform_core {
        server platform-core:8080;
    }

    upstream b2b_engine {
        server b2b-engine:8081;
    }

    upstream b2c_engine {
        server b2c-engine:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # Platform Core API
        location /api/core/ {
            proxy_pass http://platform_core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # B2B Engine API
        location /api/b2b/ {
            proxy_pass http://b2b_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # B2C Engine API
        location /api/b2c/ {
            proxy_pass http://b2c_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Discovery (Eureka)
        location /eureka/ {
            proxy_pass http://service-discovery:8761/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Actuator endpoints (secured)
        location ~ ^/api/.*/actuator/health$ {
            proxy_pass http://platform_core;
            proxy_set_header Host $host;
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
    }
}