global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
# - "first_rules.yml"

scrape_configs:
  - job_name: 'logistics-platform'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'platform-core:8080'
          - 'b2b-engine:8081'
          - 'b2c-engine:8082'
          - 'service-discovery:8761'
          - 'config-server:8888'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):(\d+)'
        replacement: '${1}'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: '/api/metrics'
    params:
      format: ['prometheus']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []