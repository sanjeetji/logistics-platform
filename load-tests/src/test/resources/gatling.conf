# Gatling Configuration

# Core settings
gatling {
  core {
    outputDirectoryBaseName = "load-tests"
    runDescription = "Logistics Platform Load Tests"
    encoding = "utf-8"
    
    directory {
      results = "target/gatling/results"
      resources = "src/test/resources"
    }
    
    elFileBodiesCacheMaxCapacity = 200
  }
  
  charting {
    maxPlotPerSeries = 1000
    useGroupDurationMetric = false
    indicators {
      lowerBound = 800      # Lower bound for the requests' response time to track in the reports
      higherBound = 1200    # Higher bound for the requests' response time to track in the reports
      percentile1 = 50      # Value for the 1st percentile to track in the reports
      percentile2 = 75      # Value for the 2nd percentile to track in the reports
      percentile3 = 95      # Value for the 3rd percentile to track in the reports
      percentile4 = 99      # Value for the 4th percentile to track in the reports
    }
  }
  
  http {
    enableGA = false
    
    # Timeouts
    requestTimeout = 60000                    # Timeout of Gatling HTTP requests
    pooledConnectionIdleTimeout = 60000       # Timeout of pooled connections
    readTimeout = 60000                       # Read timeout
    
    # Connection pool
    maxConnectionsPerHost = 6                 # Max connections per host
    connectionTimeout = 10000                 # Connection timeout
    
    # Headers
    requestCompression {
      enabled = false
    }
    
    responseCompression {
      enabled = true
    }
  }
  
  data {
    writers = [console, file]
    
    console {
      light = false
      writePeriod = 5
    }
    
    file {
      bufferSize = 8192
    }
  }
}
